# Tests only. Releasing stays local and deliberate: `npm run release` publishes from a maintainer's
# machine, this workflow holds no secrets and publishes nothing. It exists for the one thing local
# verification cannot do — running the suite on Windows.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify source, docs, tests, and package
        run: npm run verify
